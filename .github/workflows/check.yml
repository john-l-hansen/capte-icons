name: Check Capte Icons
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:release
      - uses: actions/upload-artifact@v4
        with:
          name: capte-icons-team-preview
          path: release-artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: capte-icons-website-preview
          path: apps/docs/dist/
